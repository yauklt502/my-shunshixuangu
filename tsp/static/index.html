<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>先比独 · Tick Stock Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/vendor/html2canvas.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">先</div>
        <div>
          <h1>先比独 · Tick Stock Panel</h1>
          <p class="sub">先锁共识赛道 · 比结构量价 · 独抓核心领涨</p>
        </div>
      </div>
      <div class="controls">
        <label class="field">
          <span>复盘日期</span>
          <select id="dateSelect"></select>
        </label>
        <label class="field">
          <span>数据源</span>
          <select id="sourceSelect">
            <option value="eastmoney">东方财富</option>
            <option value="tonghuashun">同花顺</option>
            <option value="tdx">通达信 TCP</option>
          </select>
        </label>
        <button id="btnRefresh" class="btn primary" type="button">刷新选股</button>
        <button id="btnShot" class="btn" type="button">一键截图</button>
      </div>
    </header>

    <section class="meta-row">
      <div id="statusPill" class="pill">加载中…</div>
      <div id="theoryPill" class="pill muted">先 / 比 / 独</div>
      <div id="updatedPill" class="pill muted">—</div>
    </section>

    <main id="captureRoot">
      <section class="panel">
        <header class="panel-head">
          <div>
            <h2>启动赛道 · 先</h2>
            <p class="panel-desc">放量转强、资金共识形成的主线板块</p>
          </div>
        </header>
        <div class="chips" id="hotBoards"></div>
      </section>

      <section class="panel">
        <header class="panel-head">
          <div>
            <h2>核心领涨 · 独</h2>
            <p class="panel-desc">点击行打开 Tick Stock Panel（日K + 分时 + 五档）</p>
          </div>
          <div id="leaderSummary" class="badge-row"></div>
        </header>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>代码</th><th>名称</th><th>题材</th><th>现价</th><th>涨幅</th>
                <th>连板</th><th>开板</th><th>先</th><th>比</th><th>独</th><th>总分</th><th>要点</th>
              </tr>
            </thead>
            <tbody id="leaderBody"></tbody>
          </table>
        </div>
      </section>

      <div class="grid-2">
        <section class="panel">
          <header class="panel-head">
            <div>
              <h2>高度锚</h2>
              <p class="panel-desc">一字/竞价封死，只看结构不做交易确认</p>
            </div>
          </header>
          <div class="table-wrap">
            <table>
              <thead><tr><th>代码</th><th>名称</th><th>连板</th><th>题材</th><th>总分</th></tr></thead>
              <tbody id="anchorBody"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <header class="panel-head">
            <div>
              <h2>观察池 · 比</h2>
              <p class="panel-desc">结构尚可，等待独立性确认</p>
            </div>
          </header>
          <div class="table-wrap">
            <table>
              <thead><tr><th>代码</th><th>名称</th><th>涨幅</th><th>连板</th><th>总分</th><th>要点</th></tr></thead>
              <tbody id="watchBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="tspMask" class="tsp-mask hidden"></div>
  <div id="tspPanel" class="tsp-panel hidden" role="dialog" aria-modal="true">
    <div class="tsp-head">
      <div>
        <div id="tspTitle" class="tsp-title">—</div>
        <div id="tspSub" class="tsp-sub">Tick Stock Panel · 日K / 分时 / 五档</div>
      </div>
      <div class="tsp-actions">
        <select id="tspChartSource">
          <option value="tdx">通达信</option>
          <option value="eastmoney">东方财富</option>
        </select>
        <button id="tspShot" class="btn" type="button">截图面板</button>
        <button id="tspClose" class="btn" type="button">关闭</button>
      </div>
    </div>
    <div class="tsp-body" id="tspCapture">
      <div class="tsp-left">
        <div class="tsp-card">
          <div class="tsp-card-title">日K</div>
          <div id="dayChart" class="chart"></div>
        </div>
        <div class="tsp-card">
          <div class="tsp-card-title">1分钟 / 5分钟</div>
          <div class="mini-tabs">
            <button type="button" class="mini-tab active" data-period="1min">1m</button>
            <button type="button" class="mini-tab" data-period="5min">5m</button>
          </div>
          <div id="intraChart" class="chart short"></div>
        </div>
      </div>
      <div class="tsp-right">
        <div class="tsp-card">
          <div class="tsp-card-title">分时</div>
          <div id="minuteChart" class="chart tall"></div>
        </div>
        <div class="tsp-card depth-card">
          <div class="tsp-card-title">五档盘口</div>
          <div id="depthBox" class="depth"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
