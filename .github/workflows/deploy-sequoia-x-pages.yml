name: Deploy Sequoia-X Pages

on:
  push:
    branches:
      - cursor/sequoia-x-backtest-b1c7
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-sequoia-x-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sequoia-x-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is off. Open Settings → Pages → Source = GitHub Actions, Save, then re-run this workflow."
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - if: steps.check.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
