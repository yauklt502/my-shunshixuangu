name: Deploy Sequoia-X Cloudflare

on:
  push:
    branches:
      - cursor/sequoia-x-backtest-b1c7
      - main
    paths:
      - "web/**"
      - "src/worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-sequoia-x-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip without Cloudflare token
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN. GitHub Pages still deploys; add the token later for workers.dev / custom domain."
          fi
      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
