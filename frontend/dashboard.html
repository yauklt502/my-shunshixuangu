<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>顺时选股 · 复盘看板</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --up: #f85149;
      --down: #3fb950;
      --font: "JetBrains Mono", "SF Mono", "Consolas", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 13px;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 1px;
      background: var(--border);
      height: calc(100vh - 49px);
    }
    .panel {
      background: var(--panel);
      padding: 12px;
      overflow: auto;
    }
    .panel-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      grid-column: 1 / -1;
    }
    .overview-item {
      background: var(--panel);
      padding: 12px 16px;
    }
    .overview-item .label { color: var(--muted); font-size: 11px; }
    .overview-item .value { font-size: 18px; margin-top: 4px; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .stock-list { list-style: none; }
    .stock-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .stock-item:hover, .stock-item.active { background: #21262d; }
    .stock-item .code { color: var(--accent); }
    #chart {
      width: 100%;
      height: 320px;
      background: #0d1117;
      border: 1px solid var(--border);
      position: relative;
    }
    .chart-bars { display: flex; align-items: flex-end; height: 280px; gap: 2px; padding: 10px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .bar {
      width: 80%;
      min-height: 2px;
      border-radius: 1px;
    }
    .signal-marker {
      font-size: 10px;
      margin-top: 2px;
    }
    .signal-buy { color: var(--up); }
    .signal-sell { color: var(--down); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 11px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      font-family: var(--font);
      font-size: 12px;
    }
    button {
      background: var(--accent);
      color: #0d1117;
      border: none;
      padding: 8px 14px;
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      margin-top: 6px;
    }
    button:hover { opacity: 0.9; }
    #equity-chart {
      height: 120px;
      border: 1px solid var(--border);
      margin-top: 8px;
      display: flex;
      align-items: flex-end;
      gap: 1px;
      padding: 4px;
    }
    .eq-bar { flex: 1; background: var(--accent); min-height: 2px; opacity: 0.7; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .metric-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 4px;
    }
    .metric-box .m-label { font-size: 10px; color: var(--muted); }
    .metric-box .m-val { font-size: 14px; margin-top: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>顺时选股 · 复盘看板</h1>
    <span class="badge">BACKTEST</span>
    <span class="badge" id="env-badge">本地模式</span>
    <span class="badge" id="ws-badge">WS: 未连接</span>
  </header>

  <div class="layout">
    <div class="overview-grid">
      <div class="overview-item">
        <div class="label">上证指数</div>
        <div class="value" id="idx-sh">—</div>
      </div>
      <div class="overview-item">
        <div class="label">涨跌家数</div>
        <div class="value" id="idx-breadth">—</div>
      </div>
      <div class="overview-item">
        <div class="label">北向资金</div>
        <div class="value" id="idx-north">—</div>
      </div>
      <div class="overview-item">
        <div class="label">策略信号数</div>
        <div class="value" id="idx-signals">0</div>
      </div>
    </div>

  <aside class="panel">
    <div class="panel-title">选股列表</div>
    <ul class="stock-list" id="stock-list"></ul>
  </aside>

  <main class="panel">
    <div class="panel-title">K 线预览 · <span id="current-symbol">000001</span></div>
    <div id="chart">
      <div class="chart-bars" id="chart-bars"></div>
    </div>
    <div class="panel-title" style="margin-top:12px">策略信号</div>
    <table>
      <thead><tr><th>时间</th><th>策略</th><th>信号</th><th>价格</th><th>原因</th></tr></thead>
      <tbody id="signal-table"></tbody>
    </table>
  </main>

  <aside class="panel">
    <div class="panel-title">回测曲线</div>
    <div id="equity-chart"></div>
    <div class="metrics">
      <div class="metric-box"><div class="m-label">总收益</div><div class="m-val" id="m-return">—</div></div>
      <div class="metric-box"><div class="m-label">胜率</div><div class="m-val" id="m-winrate">—</div></div>
      <div class="metric-box"><div class="m-label">盈亏比</div><div class="m-val" id="m-pl">—</div></div>
      <div class="metric-box"><div class="m-label">最大回撤</div><div class="m-val" id="m-dd">—</div></div>
    </div>
    <div class="panel-title" style="margin-top:16px">参数配置</div>
    <div class="form-group">
      <label>标的代码</label>
      <input type="text" id="cfg-symbol" value="000001" />
    </div>
    <div class="form-group">
      <label>K 线周期</label>
      <select id="cfg-period">
        <option value="daily">日线</option>
        <option value="60min">60分钟</option>
        <option value="5min">5分钟</option>
        <option value="1min">1分钟</option>
      </select>
    </div>
    <div class="form-group">
      <label>策略</label>
      <select id="cfg-strategy">
        <option value="ma5_climb">沿5日线爬升</option>
        <option value="triple_volume">三倍量战法</option>
        <option value="shrink_limit_up">缩量涨停</option>
        <option value="macd_cross">MACD金叉</option>
        <option value="kdj_oversold">KDJ超卖反弹</option>
      </select>
    </div>
    <div class="form-group">
      <label>单股最大仓位 (%)</label>
      <input type="number" id="cfg-max-pos" value="20" min="1" max="100" />
    </div>
    <button id="btn-run">运行回测</button>
    <button id="btn-api-run" style="background:#238636">后端回测 (API)</button>
    <button id="btn-live-start" style="background:#8957e5">启动实盘</button>
    <button id="btn-live-stop" style="background:#da3633">停止实盘</button>
    <button id="btn-save" style="background:#30363d;color:var(--text)">保存配置到本地</button>
  </aside>
  </div>

  <script>
    const STORAGE_KEY = "shunshi_dashboard_config";
    const API_BASE = window.location.origin;
    let ws = null;
    let useBackend = false;

    function setWsStatus(connected) {
      const el = document.getElementById("ws-badge");
      el.textContent = connected ? "WS: 已连接" : "WS: 未连接";
      el.style.color = connected ? "var(--down)" : "var(--muted)";
    }

    function connectWebSocket() {
      if (ws && ws.readyState <= 1) return;
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => setWsStatus(true);
      ws.onclose = () => { setWsStatus(false); setTimeout(connectWebSocket, 3000); };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          handleWsEvent(msg.type, msg.data);
        } catch (_) {}
      };
    }

    function handleWsEvent(type, data) {
      if (type === "signal") {
        appendLiveSignal(data);
      } else if (type === "bar_closed") {
        document.getElementById("env-badge").textContent = "LIVE";
        document.getElementById("idx-signals").textContent = data.signals || 0;
      } else if (type === "backtest_complete" && data.report) {
        applyBackendReport(data.report);
      } else if (type === "live_started") {
        document.getElementById("env-badge").textContent = "LIVE";
      } else if (type === "live_stopped") {
        document.getElementById("env-badge").textContent = "BACKTEST";
      }
    }

    function appendLiveSignal(data) {
      const tbody = document.getElementById("signal-table");
      const row = document.createElement("tr");
      const isBuy = data.signal === "open_long";
      row.innerHTML = `<td>实时</td><td>${data.strategy_id}</td>
        <td class="${isBuy ? "up" : "down"}">${isBuy ? "开多" : "平仓"}</td>
        <td>${Number(data.price).toFixed(2)}</td><td>${data.reason || ""}</td>`;
      tbody.prepend(row);
    }

    function applyBackendReport(report) {
      if (report.total_return != null) {
        const pct = (report.total_return * 100).toFixed(2);
        document.getElementById("m-return").textContent = `${pct}%`;
        document.getElementById("m-return").className = "m-val " + (report.total_return >= 0 ? "up" : "down");
      }
      if (report.win_rate != null)
        document.getElementById("m-winrate").textContent = `${(report.win_rate * 100).toFixed(1)}%`;
      if (report.profit_loss_ratio != null)
        document.getElementById("m-pl").textContent = Number(report.profit_loss_ratio).toFixed(2);
      if (report.max_drawdown != null)
        document.getElementById("m-dd").textContent = `${(report.max_drawdown * 100).toFixed(2)}%`;
    }

    async function runBackendBacktest() {
      const symbol = document.getElementById("cfg-symbol").value;
      const period = document.getElementById("cfg-period").value;
      document.getElementById("env-badge").textContent = "API";
      try {
        const resp = await fetch(`${API_BASE}/api/backtest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol, period, limit: 200 }),
        });
        if (!resp.ok) throw new Error("API unavailable");
        const data = await resp.json();
        useBackend = true;
        document.getElementById("idx-signals").textContent = data.signal_count || 0;
        if (data.report) applyBackendReport(data.report);
        if (data.signals?.length) {
          const tbody = document.getElementById("signal-table");
          tbody.innerHTML = data.signals.slice(-20).reverse().map(s => {
            const isBuy = String(s.signal).includes("OPEN_LONG");
            return `<tr><td>${s.timestamp || "-"}</td><td>${s.strategy_id}</td>
              <td class="${isBuy ? "up" : "down"}">${isBuy ? "开多" : "平仓"}</td>
              <td>${Number(s.price).toFixed(2)}</td><td>${s.reason || ""}</td></tr>`;
          }).join("");
        }
        runBacktestLocal();
      } catch (e) {
        alert("后端不可用，使用本地回测: " + e.message);
        runBacktestLocal();
      }
    }

    async function startLive() {
      const symbol = document.getElementById("cfg-symbol").value;
      const period = document.getElementById("cfg-period").value;
      try {
        const resp = await fetch(`${API_BASE}/api/live/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbols: [symbol], poll_interval: 5, period }),
        });
        const data = await resp.json();
        if (!data.ok) alert(data.message || "启动失败");
        else document.getElementById("env-badge").textContent = "LIVE";
      } catch (e) {
        alert("启动实盘失败: " + e.message);
      }
    }

    async function stopLive() {
      try {
        await fetch(`${API_BASE}/api/live/stop`, { method: "POST" });
        document.getElementById("env-badge").textContent = "BACKTEST";
      } catch (e) {
        alert("停止失败: " + e.message);
      }
    }

    function rand(seed) {
      let s = seed;
      return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    }

    function genMockBars(symbol, count = 60) {
      const r = rand(symbol.charCodeAt(0) * 1000);
      let price = 10 + r() * 20;
      const bars = [];
      for (let i = 0; i < count; i++) {
        const change = (r() - 0.48) * 0.04;
        const open = price;
        const close = Math.max(0.01, price * (1 + change));
        const high = Math.max(open, close) * (1 + r() * 0.01);
        const low = Math.min(open, close) * (1 - r() * 0.01);
        const vol = 1e6 + r() * 4e6;
        bars.push({ open, high, low, close, volume: vol, idx: i });
        price = close;
      }
      return bars;
    }

    function ma(arr, n) {
      return arr.map((_, i) => {
        if (i < n - 1) return null;
        const slice = arr.slice(i - n + 1, i + 1);
        return slice.reduce((a, b) => a + b, 0) / n;
      });
    }

    function runStrategy(bars, strategyId) {
      const closes = bars.map(b => b.close);
      const volumes = bars.map(b => b.volume);
      const ma5 = ma(closes, 5);
      const volMa5 = ma(volumes, 5);
      const signals = [];

      for (let i = 5; i < bars.length; i++) {
        const vr = volMa5[i] ? volumes[i] / volMa5[i] : 0;
        let signal = null;

        if (strategyId === "ma5_climb") {
          const step = ma5.slice(i - 4, i + 1).every((v, j, a) => j === 0 || v > a[j - 1]);
          if (step && closes[i] >= ma5[i]) signal = { type: "buy", reason: "沿5日线台阶爬升" };
          if (closes[i] >= Math.max(...closes.slice(i - 20, i)) * 0.98 && closes[i] < closes[i - 1])
            signal = { type: "sell", reason: "见顶预警" };
        } else if (strategyId === "triple_volume") {
          if (vr >= 3 && closes[i] > bars[i].open) signal = { type: "buy", reason: "三倍量阳线" };
          if (i > 5 && volumes[i - 1] / volMa5[i - 1] >= 3 && closes[i] < closes[i - 1] * 0.97)
            signal = { type: "sell", reason: "倍量后回落止损" };
        } else if (strategyId === "shrink_limit_up") {
          const prev = closes[i - 1];
          const chg = (closes[i] - prev) / prev;
          if (vr < 0.6 && chg >= 0.095) signal = { type: "buy", reason: "缩量涨停" };
          if (chg >= 0.095 && closes[i] < closes[i - 1]) signal = { type: "sell", reason: "涨停打开" };
        } else if (strategyId === "macd_cross") {
          const e12 = ma(closes, 12), e26 = ma(closes, 26);
          const dif = e12[i] - e26[i], prevDif = e12[i-1] - e26[i-1];
          const dea = ma(closes.map((_, j) => (e12[j]||0)-(e26[j]||0)), 9)[i];
          const prevDea = ma(closes.map((_, j) => (e12[j]||0)-(e26[j]||0)), 9)[i-1];
          if (prevDif <= prevDea && dif > dea) signal = { type: "buy", reason: "MACD金叉" };
          if (prevDif >= prevDea && dif < dea) signal = { type: "sell", reason: "MACD死叉" };
        } else if (strategyId === "kdj_oversold") {
          const k = 50 + (closes[i] - Math.min(...closes.slice(i-8,i+1))) * 2;
          if (k < 30) signal = { type: "buy", reason: "KDJ超卖" };
          if (k > 80) signal = { type: "sell", reason: "KDJ超买" };
        }

        if (signal) signals.push({ idx: i, ...signal, price: closes[i] });
      }
      return signals;
    }

    function backtest(bars, signals, initial = 1e6) {
      let cash = initial;
      let pos = 0;
      let entry = 0;
      const equity = [initial];
      const trades = [];
      const signalMap = Object.fromEntries(signals.map(s => [s.idx, s]));

      for (let i = 0; i < bars.length; i++) {
        const sig = signalMap[i];
        if (sig?.type === "buy" && pos === 0) {
          const qty = Math.floor(cash * 0.2 / bars[i].close / 100) * 100;
          if (qty > 0) {
            cash -= qty * bars[i].close;
            pos = qty;
            entry = bars[i].close;
            trades.push({ side: "buy", price: bars[i].close, idx: i });
          }
        } else if (sig?.type === "sell" && pos > 0) {
          cash += pos * bars[i].close;
          trades.push({ side: "sell", price: bars[i].close, pnl: (bars[i].close - entry) / entry, idx: i });
          pos = 0;
        }
        equity.push(cash + pos * bars[i].close);
      }

      const roundTrips = trades.filter(t => t.side === "sell");
      const wins = roundTrips.filter(t => t.pnl > 0);
      const losses = roundTrips.filter(t => t.pnl <= 0);
      const winRate = roundTrips.length ? wins.length / roundTrips.length : 0;
      const avgWin = wins.length ? wins.reduce((a, t) => a + t.pnl, 0) / wins.length : 0;
      const avgLoss = losses.length ? Math.abs(losses.reduce((a, t) => a + t.pnl, 0) / losses.length) : 1;
      let peak = equity[0], maxDD = 0;
      equity.forEach(e => {
        if (e > peak) peak = e;
        const dd = (peak - e) / peak;
        if (dd > maxDD) maxDD = dd;
      });

      return {
        equity,
        totalReturn: (equity[equity.length - 1] - initial) / initial,
        winRate,
        profitLossRatio: avgWin / avgLoss,
        maxDrawdown: maxDD,
        trades,
      };
    }

    function renderChart(bars, signals) {
      const container = document.getElementById("chart-bars");
      const maxH = Math.max(...bars.map(b => b.high));
      const minL = Math.min(...bars.map(b => b.low));
      const range = maxH - minL || 1;
      const signalMap = Object.fromEntries(signals.map(s => [s.idx, s]));

      container.innerHTML = bars.map((b, i) => {
        const h = ((b.high - minL) / range) * 260;
        const color = b.close >= b.open ? "var(--up)" : "var(--down)";
        const sig = signalMap[i];
        const marker = sig
          ? `<div class="signal-marker ${sig.type === "buy" ? "signal-buy" : "signal-sell"}">${sig.type === "buy" ? "▲" : "▼"}</div>`
          : "";
        return `<div class="bar-wrap">${marker}<div class="bar" style="height:${h}px;background:${color}"></div></div>`;
      }).join("");
    }

    function renderEquity(equity) {
      const max = Math.max(...equity);
      const min = Math.min(...equity);
      const range = max - min || 1;
      document.getElementById("equity-chart").innerHTML = equity.map(e =>
        `<div class="eq-bar" style="height:${((e - min) / range) * 100}%"></div>`
      ).join("");
    }

    function renderSignals(signals, bars) {
      const tbody = document.getElementById("signal-table");
      tbody.innerHTML = signals.slice(-20).reverse().map(s => `
        <tr>
          <td>第${s.idx}根</td>
          <td>${document.getElementById("cfg-strategy").value}</td>
          <td class="${s.type === "buy" ? "up" : "down"}">${s.type === "buy" ? "开多" : "平仓"}</td>
          <td>${s.price.toFixed(2)}</td>
          <td>${s.reason}</td>
        </tr>
      `).join("");
      document.getElementById("idx-signals").textContent = signals.length;
    }

    function initStockList() {
      const stocks = [
        { code: "000001", name: "平安银行", chg: 1.2 },
        { code: "600519", name: "贵州茅台", chg: -0.5 },
        { code: "300750", name: "宁德时代", chg: 2.1 },
        { code: "002594", name: "比亚迪", chg: 0.8 },
        { code: "601318", name: "中国平安", chg: -1.1 },
      ];
      const list = document.getElementById("stock-list");
      list.innerHTML = stocks.map(s => `
        <li class="stock-item" data-code="${s.code}">
          <span><span class="code">${s.code}</span> ${s.name}</span>
          <span class="${s.chg >= 0 ? "up" : "down"}">${s.chg >= 0 ? "+" : ""}${s.chg}%</span>
        </li>
      `).join("");

      list.querySelectorAll(".stock-item").forEach(el => {
        el.addEventListener("click", () => {
          list.querySelectorAll(".stock-item").forEach(e => e.classList.remove("active"));
          el.classList.add("active");
          document.getElementById("cfg-symbol").value = el.dataset.code;
          runBacktest();
        });
      });
      list.firstChild?.classList.add("active");
    }

    function updateOverview() {
      document.getElementById("idx-sh").innerHTML = `<span class="up">3245.32 +0.68%</span>`;
      document.getElementById("idx-breadth").innerHTML = `<span class="up">2856</span> / <span class="down">1987</span>`;
      document.getElementById("idx-north").innerHTML = `<span class="up">+42.6亿</span>`;
    }

    function runBacktestLocal() {
      const symbol = document.getElementById("cfg-symbol").value;
      const strategy = document.getElementById("cfg-strategy").value;
      document.getElementById("current-symbol").textContent = symbol;

      const bars = genMockBars(symbol, 80);
      const signals = runStrategy(bars, strategy);
      const result = backtest(bars, signals);

      renderChart(bars, signals);
      renderSignals(signals, bars);
      renderEquity(result.equity);

      const retPct = (result.totalReturn * 100).toFixed(2);
      document.getElementById("m-return").textContent = `${retPct}%`;
      document.getElementById("m-return").className = "m-val " + (result.totalReturn >= 0 ? "up" : "down");
      document.getElementById("m-winrate").textContent = `${(result.winRate * 100).toFixed(1)}%`;
      document.getElementById("m-pl").textContent = result.profitLossRatio.toFixed(2);
      document.getElementById("m-dd").textContent = `${(result.maxDrawdown * 100).toFixed(2)}%`;

      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        symbol, strategy,
        maxPos: document.getElementById("cfg-max-pos").value,
        period: document.getElementById("cfg-period").value,
        lastResult: { totalReturn: result.totalReturn, winRate: result.winRate },
      }));
    }

    function runBacktest() { runBacktestLocal(); }

    document.getElementById("btn-run").addEventListener("click", runBacktestLocal);
    document.getElementById("btn-api-run").addEventListener("click", runBackendBacktest);
    document.getElementById("btn-live-start").addEventListener("click", startLive);
    document.getElementById("btn-live-stop").addEventListener("click", stopLive);
    document.getElementById("btn-save").addEventListener("click", () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        symbol: document.getElementById("cfg-symbol").value,
        strategy: document.getElementById("cfg-strategy").value,
        maxPos: document.getElementById("cfg-max-pos").value,
        period: document.getElementById("cfg-period").value,
      }));
      alert("配置已保存到 localStorage");
    });

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const cfg = JSON.parse(saved);
        if (cfg.symbol) document.getElementById("cfg-symbol").value = cfg.symbol;
        if (cfg.strategy) document.getElementById("cfg-strategy").value = cfg.strategy;
        if (cfg.maxPos) document.getElementById("cfg-max-pos").value = cfg.maxPos;
        if (cfg.period) document.getElementById("cfg-period").value = cfg.period;
      } catch (_) {}
    }

    initStockList();
    updateOverview();
    connectWebSocket();
    if (location.port === "8000" || location.pathname === "/") {
      document.getElementById("env-badge").textContent = "API";
    }
    runBacktestLocal();
  </script>
</body>
</html>
