<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>近3月回测 · 10秒定龙头</title>
  <style>
    :root {
      --bg: #ffffff; --panel: #ffffff; --line: #e5e7eb; --text: #1a1d26;
      --muted: #6b7280; --gold: #a16207; --cyan: #0f766e; --red: #dc2626; --green: #15803d;
    }
    body { margin: 0; font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
    a { color: var(--cyan); }
    .wrap { padding: 18px 24px 40px; display: grid; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .kicker { color: var(--muted); font-size: 12px; }
    li { margin: 6px 0; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); }
    tr.best td { background: rgba(61,214,140,.08); }
    .note { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-size:22px">近3个月回测 · 他说的话对不对</div>
      <div class="kicker">主线火车头 vs 最高板 / 最先封 / 成交额最大 / 支线高标 / 全部涨停等权</div>
    </div>
    <div><a href="/">回实时盯盘</a></div>
  </header>
  <div class="wrap">
    <div class="card" id="verdict">加载报告…</div>
    <div class="card">
      <div class="kicker">次日收盘相对当日收盘（盘后盯的表现，不是当天打板可成交收益）</div>
      <table><thead><tr>
        <th>策略</th><th>天数</th><th>次日均涨%</th><th>中位%</th><th>胜率%</th><th>再封%</th><th>大亏%(≤-5)</th><th>最好</th><th>最差</th>
      </tr></thead><tbody id="sum"></tbody></table>
    </div>
    <div class="card">
      <div class="kicker">逐日样本（盯1只）</div>
      <div style="overflow:auto;max-height:480px">
        <table>
          <thead><tr><th>日期</th><th>主线</th><th>盯</th><th>板</th><th>换手</th><th>次日%</th><th>再封</th></tr></thead>
          <tbody id="days"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="kicker">主线火车头 · 分月</div>
      <table><thead><tr><th>月份</th><th>天数</th><th>均涨%</th><th>胜率%</th><th>再封%</th><th>大亏%</th></tr></thead>
      <tbody id="monthly"></tbody></table>
    </div>
    <div class="note" id="note"></div>
  </div>
<script>
fetch("/api/backtest").then(r=>r.json()).then(s=>{
  if (!s.ok) { document.getElementById("verdict").textContent = s.error || "无报告"; return; }
  document.getElementById("verdict").innerHTML =
    `<div class="kicker">${s.start} → ${s.end} · ${s.days} 个交易日 · ${s.source}</div>` +
    `<ul>${(s.verdict.lines||[]).map(x=>`<li>${x}</li>`).join("")}</ul>`;
  const order = ["method","first_tradable","height_tradable","first_market","height_market","amount_market","side_height","all_zt"];
  const best = Math.max(...order.map(k=>s.summary[k]?.avg ?? -999));
  document.getElementById("sum").innerHTML = order.map(k=>{
    const x=s.summary[k]; if(!x||!x.n) return "";
    return `<tr class="${x.avg===best?"best":""}">
      <td>${x.label}</td><td>${x.n}</td><td>${x.avg}</td><td>${x.median}</td>
      <td>${x.win_rate}</td><td>${x.zt_rate}</td><td>${x.big_loss_rate}</td>
      <td>${x.best}</td><td>${x.worst}</td></tr>`;
  }).join("");
  document.getElementById("days").innerHTML = (s.samples||[]).map(d=>{
    const w=d.watch||{};
    const cls = w.next_pct>0 ? "color:var(--green)" : (w.next_pct<0?"color:var(--red)":"");
    return `<tr>
      <td>${d.date}</td><td>${d.mainline||""}</td><td>${w.name||"-"}</td>
      <td>${w.boards??""}</td><td>${w.turnover??""}</td>
      <td style="${cls}">${w.next_pct??""}</td><td>${w.next_zt===true?"是":(w.next_zt===false?"否":"")}</td>
    </tr>`;
  }).join("");
  document.getElementById("monthly").innerHTML = Object.values(s.monthly||{}).map(x=>
    `<tr><td>${x.label}</td><td>${x.n}</td><td>${x.avg}</td><td>${x.win_rate}</td><td>${x.zt_rate}</td><td>${x.big_loss_rate}</td></tr>`
  ).join("");
  document.getElementById("note").innerHTML = (s.note||[]).join("<br/>");
});
</script>
</body>
</html>
